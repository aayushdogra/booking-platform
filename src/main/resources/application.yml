spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/booking_db?options=-c%20TimeZone=Asia/Kolkata
    username: postgres
    password: postgres
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health